# lifeos-daemon — headless LifeOS node for Pi Zero 2 W / Pi 3 (64-bit Linux).
#
# The daemon bridges Cognitum-Seed sensor frames to MQTT. It stays pure Rust:
# reqwest uses rustls and rumqttc is built without native TLS or OpenSSL.
#
# Dependency posture: pure-Rust only. No `openssl-sys`. We pull `lifeos-core`
# with `default-features = false` and opts into the production HTTP and
# envctl-bound PostgreSQL runtime surfaces explicitly.

[package]
name = "lifeos-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Headless LifeOS sensor-bridge daemon (Pi Zero 2 W / Pi 3, aarch64-unknown-linux-gnu)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "lifeos-daemon"
path = "src/main.rs"

[dependencies]
# The daemon must capture exact device bytes through the canonical database
# procedure before publishing any derived MQTT payload.
lifeos-core = { path = "../lifeos-core", default-features = false, features = ["mcp-http", "storage"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
